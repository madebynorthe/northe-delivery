<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071e46"><title>AUDAZ × Estrela do Norte — Match Day</title><style>html,body{margin:0;min-height:100%;background:#080b0f;color:#f4f7fa;font-family:Arial,Helvetica,sans-serif}body{display:grid;place-items:center}.load{font-size:10px;font-weight:900;letter-spacing:.18em;opacity:.7}</style></head><body><div class="load">MATCH DAY · CARREGANDO</div><script>(async()=>{try{const v='20260913-final5';const r=await fetch('./final3.gz.b64?v='+v,{cache:'no-store'});if(!r.ok)throw new Error('bundle '+r.status);const b64=(await r.text()).trim();const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const source=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const doc=new DOMParser().parseFromString(source,'text/html');doc.querySelectorAll('a[href*="artes.html"]').forEach(a=>a.setAttribute('href','/audaz-delivery/estrela-do-norte-matchday/artes.html?v='+v));const logo='./northe-logo.svg?v='+v;doc.querySelectorAll('img').forEach(img=>{const marker=[img.getAttribute('src'),img.getAttribute('alt'),img.getAttribute('class'),img.getAttribute('id')].filter(Boolean).join(' ').toLowerCase();if(marker.includes('audaz')){img.setAttribute('src',logo);img.setAttribute('alt','NORTHE')}});doc.querySelectorAll('svg').forEach(svg=>{const marker=[svg.getAttribute('aria-label'),svg.getAttribute('id'),svg.getAttribute('class'),svg.querySelector('title')?.textContent].filter(Boolean).join(' ').toLowerCase();if(marker.includes('audaz')){const img=doc.createElement('img');img.setAttribute('src',logo);img.setAttribute('alt','NORTHE');img.setAttribute('style',svg.getAttribute('style')||'');svg.replaceWith(img)}});doc.querySelectorAll('[class*="logo"],[id*="logo"],[class*="brand"],[id*="brand"]').forEach(el=>{if((el.textContent||'').trim().toUpperCase()==='AUDAZ'){const img=doc.createElement('img');img.setAttribute('src',logo);img.setAttribute('alt','NORTHE');img.style.maxWidth='100%';img.style.maxHeight='100%';img.style.objectFit='contain';el.replaceChildren(img)}});const html='<!doctype html>'+doc.documentElement.outerHTML;document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load">ERRO AO CARREGAR A ENTREGA FINAL.</div>';console.error(e)}})();</script></body></html>
