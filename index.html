<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>NORTHE — Portal do Cliente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;1,800;1,900&display=swap" rel="stylesheet">
  <style>:root{--rec:#c44c4c;--g:#090909;--o:#f0eee8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090909;color:var(--o);font-family:Poppins,Arial,sans-serif;padding:24px}.box{width:min(680px,100%);border:1px solid #f0eee824;padding:40px}.mark{font-size:38px;font-weight:900;font-style:italic;letter-spacing:-.06em}.ey{margin-top:34px;color:var(--rec);font-size:10px;letter-spacing:.18em}.box h1{font-size:clamp(34px,7vw,62px);line-height:.96;font-style:italic;margin:12px 0;text-transform:uppercase}.box p{color:#aaa79e;font-size:13px;line-height:1.7;max-width:520px}.sig{margin-top:28px;color:#727579;font-size:10px;letter-spacing:.16em;text-transform:uppercase}</style>
</head>
<body><main class="box"><div class="mark">NORTHE</div><div class="ey">PORTAL DO CLIENTE</div><h1>Experiência de entrega.</h1><p>Este ambiente é acessado pelo link exclusivo de cada projeto. Se você é cliente NORTHE, utilize o endereço enviado pela nossa equipe.</p><div class="sig">MADE IN THE NORTH.</div></main></body>
</html>
