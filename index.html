<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>NORTHE — Portal do Cliente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;1,800;1,900&display=swap" rel="stylesheet">
  <style>:root{--accent:#c99a4b;--black:#090909;--off:#f0eee8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090909;color:var(--off);font-family:Poppins,Arial,sans-serif;padding:24px}.box{width:min(680px,100%);border:1px solid #f0eee824;padding:40px}.mark{font-size:38px;font-weight:900;letter-spacing:.08em}.mark:after{content:"";display:block;width:74px;height:4px;border-radius:99px;background:var(--accent);margin-top:8px}.ey{margin-top:34px;color:var(--accent);font-size:10px;letter-spacing:.18em}.box h1{font-size:clamp(34px,7vw,62px);line-height:.96;margin:12px 0;text-transform:uppercase}.box p{color:#aaa8a2;font-size:13px;line-height:1.7;max-width:520px}</style>
</head>
<body><main class="box"><div class="mark">NORTHE</div><div class="ey">PORTAL DO CLIENTE</div><h1>Experiência de entrega.</h1><p>Este ambiente é acessado pelo link exclusivo de cada projeto. Se você é cliente NORTHE, utilize o endereço enviado pela nossa equipe.</p></main><!-- NORTHE Delivery --></body>
</html>
