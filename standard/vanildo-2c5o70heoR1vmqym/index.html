<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Galeria de entrega da Northe para Vanildo.">
  <meta name="theme-color" content="#151514">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Vanildo · Galeria Northe</title>
  <link rel="preconnect" href="https://drive.google.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;1,900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      font-family: Poppins, Arial, sans-serif;
      background: #151514;
      color: #e8e4d6;
      --muted: #aaa79e;
      --line: rgb(232 228 214 / 14%);
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }
    button { font: inherit; cursor: pointer; }

    .wrap {
      width: min(1264px, calc(100% - 2 * clamp(18px, 5vw, 72px)));
      margin-inline: auto;
    }

    .masthead { border-bottom: 1px solid var(--line); }
    .masthead .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 69px;
      gap: 12px;
    }

    .wordmark { font-size: 24px; letter-spacing: -.05em; font-style: italic; font-weight: 900; }

    .original {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 13px;
      font-size: .875rem;
      font-weight: 600;
      text-decoration: none;
    }

    :focus-visible { outline: 2px solid #ff725e; outline-offset: 4px; }
    .intro { padding-block: clamp(28px, 5vw, 55px) 23px; }
    .eyebrow { margin: 0 0 6px; color: var(--muted); font-size: .9375rem; }
    .album-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 6.5vw, 4.25rem);
      line-height: 1;
      font-weight: 700;
      letter-spacing: -.065em;
    }
    .count { margin: 0; color: var(--muted); font-size: .875rem; white-space: nowrap; }

    .gallery {
      --columns: 4;
      display: grid;
      position: relative;
      column-gap: clamp(8px, 1vw, 14px);
      list-style: none;
      padding: 0;
      margin: 0 0 55px;
    }
    .tile { position: absolute; }

    .photo {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      width: 100%;
      padding: 0;
      border: 0;
      overflow: hidden;
      border-radius: 8px;
      background: #242422;
      color: var(--muted);
    }
    .photo:focus-visible { z-index: 1; }
    .photo img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .photo-fallback { padding: 12px; text-align: center; font-size: .8125rem; }
    .tile-download {
      position: absolute;
      z-index: 2;
      right: 8px;
      bottom: 8px;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #fff;
      color: #22221f;
      box-shadow: 0 1px 5px rgb(0 0 0 / 24%);
      text-decoration: none;
    }
    .tile-download:hover { background: #efede8; }
    .download-icon {
      width: 16px;
      height: 19px;
      border-bottom: 1.5px solid;
      font: 20px/16px system-ui, sans-serif;
      text-align: center;
    }

    .viewer {
      width: min(1080px, calc(100vw - 32px));
      max-width: none;
      max-height: none;
      margin: auto;
      padding: 0;
      border: 1px solid #47443e;
      border-radius: 9px;
      background: #171715;
      color: #fff;
    }
    .viewer::backdrop { background: rgb(14 13 12 / 84%); }
    html:has(.viewer[open]) { overflow: hidden; }
    .viewer-inner { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
    .viewer-bar, .viewer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 13px;
    }
    .viewer-bar { border-bottom: 1px solid #3b3935; }
    .viewer-footer { border-top: 1px solid #3b3935; }
    .viewer-name { margin: 0; font-size: .9375rem; font-weight: 600; }
    .position { margin: 0; font-size: .875rem; color: #d4d1ca; white-space: nowrap; }

    .stage {
      height: min(68dvh, 760px);
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 44px;
      align-items: center;
      gap: 8px;
      padding: 8px;
    }
    .frame { display: grid; place-items: center; min-width: 0; height: 100%; overflow: hidden; }
    .frame img { display: block; width: 100%; height: 100%; min-height: 0; object-fit: contain; }
    .frame p { text-align: center; color: #e1ded8; }

    .icon-button {
      width: 44px;
      height: 44px;
      background: transparent;
      color: #fff;
      border: 1px solid transparent;
      border-radius: 6px;
      font-size: 1.35rem;
    }
    .icon-button:hover, .original:hover { background: #32312c; }
    .icon-button:disabled { opacity: .35; cursor: default; }
    .icon-button:disabled:hover { background: transparent; }
    .viewer :focus-visible { outline-color: #c6dff5; outline-offset: 1px; }
    .original { border-color: #68645b; }
    [hidden] { display: none !important; }

    @media (max-width: 920px) {
      .gallery { --columns: 3; }
    }
    @media (max-width: 590px) {
      .gallery { --columns: 2; }
      .masthead .wrap { min-height: 62px; }
      .viewer { width: calc(100vw - 16px); }
      .stage { grid-template-columns: 42px minmax(0, 1fr) 42px; gap: 0; padding-inline: 0; height: 62dvh; }
      .stage .icon-button { width: 42px; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <span class="wordmark">NORTHE</span>
    </div>
  </header>

  <main class="wrap">
    <div class="intro">
      <p class="eyebrow">Galeria de entrega</p>
      <div class="album-title">
        <h1>Vanildo</h1>
        <p class="count" id="photo-count"></p>
      </div>
    </div>

    <ul class="gallery" aria-label="Fotos da entrega"></ul>
    <noscript>Ative o JavaScript para ver a galeria.</noscript>
  </main>

  <dialog class="viewer" aria-labelledby="viewer-name">
    <div class="viewer-inner">
      <div class="viewer-bar">
        <h2 class="viewer-name" id="viewer-name"></h2>
        <form method="dialog">
          <button class="icon-button" aria-label="Fechar foto" autofocus>×</button>
        </form>
      </div>
      <div class="stage">
        <button type="button" class="icon-button" id="previous" aria-label="Foto anterior">‹</button>
        <div class="frame"></div>
        <button type="button" class="icon-button" id="next" aria-label="Próxima foto">›</button>
      </div>
      <div class="viewer-footer">
        <p class="position" aria-live="polite"></p>
        <a class="original">Baixar original <span aria-hidden="true">↓</span></a>
      </div>
    </div>
  </dialog>

      const item = document.createElement('li');
      const button = document.createElement('button');
      const image = document.createElement('img');
      const fallback = document.createElement('span');
      const file = document.createElement('a');
      const icon = document.createElement('span');

      item.className = 'tile';
      item.style.aspectRatio = `${width} / ${height}`;
      button.type = 'button';
      button.className = 'photo';
      button.setAttribute('aria-label', `Ampliar foto ${index + 1}, ${filename}`);
      fallback.className = 'photo-fallback';
      fallback.textContent = `${filename} · Abrir foto`;
      fallback.hidden = true;

      image.alt = '';
      image.width = width;
      image.height = height;
      image.decoding = 'async';
      image.loading = index < 8 ? 'eager' : 'lazy';
      image.addEventListener('error', () => {
        image.hidden = true;
        fallback.hidden = false;
      }, { once: true });
      image.src = thumbnail(id, 640);

      button.addEventListener('click', () => {
        showPhoto(index);
        viewer.showModal();
      });
      file.className = 'tile-download';
      file.href = download(id);
      file.download = filename;
      file.title = 'Baixar original';
      file.setAttribute('aria-label', `Baixar original de ${filename}, foto ${index + 1}`);
      icon.className = 'download-icon';
      icon.setAttribute('aria-hidden', 'true');
      icon.textContent = '↓';
      file.append(icon);
      button.append(fallback, image);
      item.append(button, file);
      return item;
    }

    function placeTiles() {
      const styles = getComputedStyle(gallery);
      const columnCount = Number(styles.getPropertyValue('--columns'));
      const gap = parseFloat(styles.columnGap);
      const width = (gallery.clientWidth - gap * (columnCount - 1)) / columnCount;
      if (width <= 0 || width === lastTileWidth) return;
      lastTileWidth = width;
      const bottoms = Array(columnCount).fill(0);
      tiles.forEach((tile, index) => {
        const column = bottoms.indexOf(Math.min(...bottoms));
        const [, , photoWidth, photoHeight] = photos[index];
        tile.style.width = `${width}px`;
        tile.style.left = `${column * (width + gap)}px`;
        tile.style.top = `${bottoms[column]}px`;
        bottoms[column] += width * photoHeight / photoWidth + gap;
      });
      gallery.style.height = `${Math.max(...bottoms) - gap}px`;
    }

    function showPhoto(index) {
      current = index;
      const [id, filename] = photos[index];
      const image = document.createElement('img');
      const error = document.createElement('p');
      image.alt = `Foto ${index + 1} da entrega, ${filename}`;
      error.textContent = 'Prévia indisponível. Use o link para baixar o original.';
      error.hidden = true;
      image.addEventListener('error', () => {
        image.hidden = true;
        error.hidden = false;
      }, { once: true });
      frame.replaceChildren(image, error);
      name.textContent = filename;
      position.textContent = `${index + 1} de ${photos.length}`;
      original.href = download(id);
      original.download = filename;
      previous.disabled = index === 0;
      next.disabled = index === photos.length - 1;
      image.src = thumbnail(id, 1600);
    }

    function step(direction) {
      const index = current + direction;
      if (index >= 0 && index < photos.length) showPhoto(index);
    }

    const tiles = photos.map(makeCard);
    let lastTileWidth = 0;
    gallery.replaceChildren(...tiles);
    placeTiles();
    new ResizeObserver(placeTiles).observe(gallery);
    previous.addEventListener('click', () => step(-1));
    next.addEventListener('click', () => step(1));
    viewer.addEventListener('click', event => {
      if (event.target === viewer) viewer.close();
    });
    viewer.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        event.preventDefault();
        step(event.key === 'ArrowLeft' ? -1 : 1);
      }
    });
  </script>
</body>
</html>
